# Template rendered at container start by /usr/local/bin/hermes-entrypoint.sh.
# Only BACKEND_HOST / BACKEND_PORT are substituted there; nginx's own
# $variables are left intact so proxy_pass can use a variable (see below).
#   Docker Compose: BACKEND_HOST=backend / BACKEND_PORT=8000.
#   Railway:        BACKEND_HOST=hermes.railway.internal / BACKEND_PORT=8000.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Generated from /etc/resolv.conf at startup. Railway and Docker use
    # different private DNS addresses, so this must not be hardcoded.
    include /etc/nginx/resolver.conf;

    # A variable in proxy_pass makes nginx resolve BACKEND_HOST at request
    # time (using the resolver above, cached 10s). A literal hostname is
    # resolved only once at startup, which leaves nginx dialling old
    # container IPs after a backend redeploy -> 504 / "Failed to fetch".
    set $backend http://${BACKEND_HOST}:${BACKEND_PORT};

    location /api/ {
        # Strip /api/ before forwarding, matching the Vite development proxy.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail fast instead of hanging until the client gives up.
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_buffering off;
    }

    # Missing hashed assets must be a real 404, not the SPA index fallback.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
