# Upstream backend, supplied by the container environment before nginx starts
# (the Dockerfile copies this file to /etc/nginx/templates/default.conf.template
# so the stock nginx image env-substitutes it at startup via BACKEND_HOST /
# BACKEND_PORT; Dockerfile ENV provides defaults, setup-specific overrides win).
#   Docker Compose: compose.yaml sets BACKEND_HOST=backend / BACKEND_PORT=8000.
#   Railway:        set BACKEND_HOST=backend.railway.internal / BACKEND_PORT=8000.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # The trailing slash strips /api/, matching the Vite development proxy.
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /ws {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Missing hashed assets must be a real 404, not the SPA index fallback.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
